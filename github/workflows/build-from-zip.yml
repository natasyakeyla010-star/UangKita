name: Build UangKita APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'UangKita_Android_Siap_Build.zip'
      - '.github/workflows/build-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q UangKita_Android_Siap_Build.zip -d build-src
          find build-src -maxdepth 3 -type f | sort

      - name: Generate Gradle wrapper
        working-directory: build-src
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: build-src
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UangKita-debug-apk
          path: build-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
